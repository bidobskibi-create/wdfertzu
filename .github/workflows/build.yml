name: build
on: [push, workflow_dispatch]

jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK & packages
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-19 build-tools;34.0.0'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Locate and run build script
        run: |
          BUILD_SCRIPT=$(find . -name "build.sh" -not -path "*/.*" | head -n 1)
          if [ -z "$BUILD_SCRIPT" ]; then
            echo "Error: build.sh not found in repository"
            exit 1
          fi
          BUILD_DIR=$(dirname "$BUILD_SCRIPT")
          echo "Building in directory: $BUILD_DIR"
          cd "$BUILD_DIR"
          bash build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiuiHome-flash
          path: "**/out/MiuiHome-flash.zip"
